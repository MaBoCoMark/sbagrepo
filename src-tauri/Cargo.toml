[package]
name = "singbox-desktop"
version = "0.1.0"
description = "sing-box Control Center desktop application"
authors = ["singbox-desktop contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
