[package]
name = "singbox-desktop"
version = "1.0.0"
description = "sing-box Desktop MVP"
authors = ["sing-box"]
edition = "2021"

[lib]
name = "singbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.2", features = ["full"] }
keyring = "2.3"
openssl = { version = "0.10", features = ["vendored"] }
hudsucker = { version = "0.25", features = ["full"] }
rcgen = "0.14"
rand = "0.8"
